version: 2.1

orbs:
  git-shallow-clone: guitarrapc/git-shallow-clone@2.8.0

jobs:
  build-chromium-linux:
    machine:
      image: ubuntu-2204:2024.01.1
    resource_class: large
    working_directory: ~/project
    steps:
      - git-shallow-clone/checkout
      - run:
          name: Maximize Build Space
          command: |
            echo "Removing large pre-installed tools to free up disk space..."
            sudo rm -rf /usr/share/dotnet
            sudo rm -rf /opt/ghc
            sudo rm -rf "/usr/local/share/boost"
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
            df -h
      - restore_cache:
          keys:
            - depot-tools-v1
      - run:
          name: Install depot_tools
          command: |
            if [ ! -d "depot_tools" ]; then
              git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
            else
              echo "depot_tools found in cache."
            fi
      - save_cache:
          key: depot-tools-v1
          paths:
            - depot_tools
      - run:
          name: Add depot_tools to PATH
          command: |
            echo 'export PATH=/home/circleci/project/depot_tools:$PATH' >> $BASH_ENV
            source $BASH_ENV
      - run:
          name: Configure Git
          command: |
            git config --global user.name "CircleCI"
            git config --global user.email "ci@circleci.com"
            git config --global core.precomposeUnicode true
      - run:
          name: Fetch Chromium Source Code
          command: |
            timeout 180m fetch --nohooks --no-history chromium
      - restore_cache:
          keys:
            - ccache-v1-{{ .Branch }}-{{ .Revision }}
            - ccache-v1-{{ .Branch }}-
      - run:
          name: Install Build Dependencies & Run Hooks
          working_directory: ~/project/src
          command: |
            echo "Installing system build dependencies..."
            sudo ./build/install-build-deps.sh --no-prompt --no-arm --no-chromeos-fonts
            echo "Running gclient hooks..."
            gclient runhooks
      - run:
          name: Set up ccache
          command: |
            mkdir -p ~/project/.ccache
            echo "max_size = 15.0G" > ~/project/.ccache/ccache.conf
      - run:
          name: Setup GN Build
          working_directory: ~/project/src
          command: |
            gn gen out/Default --args='is_debug=false is_component_build=true symbol_level=0 cc_wrapper="ccache"'
      - run:
          name: Build Chromium with autoninja
          working_directory: ~/project/src
          command: |
            autoninja -C out/Default chrome
      - save_cache:
          key: ccache-v1-{{ .Branch }}-{{ .Revision }}
          paths:
            - .ccache
      - run:
          name: Package Artifacts
          command: |
            mkdir -p artifacts
            cp src/out/Default/chrome artifacts/
            cp src/out/Default/chrome_100_percent.pak artifacts/
            cp src/out/Default/chrome_200_percent.pak artifacts/
            cp src/out/Default/resources.pak artifacts/
            cp src/out/Default/icudtl.dat artifacts/
            cp -r src/out/Default/locales artifacts/
            cp -r src/out/Default/swiftshader artifacts/
            find src/out/Default -maxdepth 1 -name "*.so" -exec cp {} artifacts/ \;
      - store_artifacts:
          path: artifacts

workflows:
  version: 2
  build-chromium:
    jobs:
      - build-chromium-linux:
          filters:
            branches:
              only:
                - main
